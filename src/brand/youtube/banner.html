<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Lato; font-weight: 400; src: url(fonts/Lato-Regular.ttf); }
  @font-face { font-family: Lato; font-weight: 700; src: url(fonts/Lato-Bold.ttf); }
  @font-face { font-family: Lato; font-weight: 900; src: url(fonts/Lato-Black.ttf); }
  @font-face { font-family: Comfortaa; src: url(fonts/Comfortaa.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; font-family: Lato, sans-serif; }
  #bg { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 70% 30%, #1d4a8f 0%, rgba(29,74,143,0) 62%), linear-gradient(160deg, #12305e 0%, #0b1f40 72%); }
  #dots { position: absolute; inset: 0; opacity: .18; background-image: radial-gradient(#5f86c9 2px, transparent 2.4px); background-size: 64px 64px; }
  .art { position: absolute; opacity: .55; }
  /* the safe area every device shows: 1546 x 423, centred */
  #safe { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #fff; }
  .wm { display: inline-flex; align-items: center; gap: 30px; font-family: Comfortaa, sans-serif; font-weight: 600; font-size: 104px; line-height: 1; color: #fff; }
  .wm-box { border: 7px solid currentColor; border-radius: 26px; padding: 22px 26px 8px 22px; }
  .wm-ins { font-family: Lato, sans-serif; font-weight: 900; color: #35c2e8; letter-spacing: -.01em; }
  .tag { margin-top: 44px; font-size: 52px; font-weight: 700; color: #e4ecf8; }
  .sub { margin-top: 22px; font-size: 34px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #35c2e8; }
  #guide { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px; outline: 4px dashed #ff4d6d; display: none; }
  body.check #guide { display: block; }
</style></head>
<body>
<div id="bg"></div><div id="dots"></div>

<!-- left: a price staircase -->
<svg class="art" style="left:90px; top:330px" width="380" height="780" viewBox="0 0 380 780">
  <g fill="#35c2e8">
    <rect x="0" y="640" width="64" height="140" rx="10"/><rect x="80" y="560" width="64" height="220" rx="10"/>
    <rect x="160" y="470" width="64" height="310" rx="10"/><rect x="240" y="370" width="64" height="410" rx="10"/>
  </g>
  <rect x="320" y="200" width="60" height="580" rx="10" fill="#f08a3c"/>
</svg>
<!-- right: a 2x2 with a few dots -->
<svg class="art" style="right:56px; top:300px" width="420" height="420" viewBox="0 0 420 420" fill="none">
  <rect x="2" y="2" width="198" height="198" rx="18" stroke="#c9d7ee" stroke-width="3"/><rect x="220" y="2" width="198" height="198" rx="18" stroke="#35c2e8" stroke-width="4" fill="rgba(53,194,232,.14)"/>
  <rect x="2" y="220" width="198" height="198" rx="18" stroke="#c9d7ee" stroke-width="3"/><rect x="220" y="220" width="198" height="198" rx="18" stroke="#c9d7ee" stroke-width="3"/>
  <circle cx="300" cy="80" r="18" fill="#f08a3c"/><circle cx="360" cy="140" r="14" fill="#35c2e8"/><circle cx="110" cy="300" r="14" fill="#c9d7ee"/><circle cx="280" cy="330" r="14" fill="#c9d7ee"/>
</svg>
<!-- right, lower: a rising line -->
<svg class="art" style="right:70px; top:820px" width="480" height="300" viewBox="0 0 480 300" fill="none">
  <path d="M10 260 L110 220 L200 230 L290 150 L370 120 L450 30" stroke="#35c2e8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="450" cy="30" r="16" fill="#f08a3c"/>
</svg>
<!-- left, top: a waveform, for the narration -->
<svg class="art" style="left:110px; top:150px" width="520" height="120" viewBox="0 0 520 120">
  <g fill="#35c2e8">
    <rect x="0" y="50" width="12" height="20" rx="6"/><rect x="26" y="34" width="12" height="52" rx="6"/><rect x="52" y="14" width="12" height="92" rx="6"/><rect x="78" y="40" width="12" height="40" rx="6"/>
    <rect x="104" y="24" width="12" height="72" rx="6"/><rect x="130" y="4" width="12" height="112" rx="6"/><rect x="156" y="30" width="12" height="60" rx="6"/><rect x="182" y="44" width="12" height="32" rx="6"/>
    <rect x="208" y="20" width="12" height="80" rx="6"/><rect x="234" y="36" width="12" height="48" rx="6"/><rect x="260" y="50" width="12" height="20" rx="6"/><rect x="286" y="28" width="12" height="64" rx="6"/>
    <rect x="312" y="44" width="12" height="32" rx="6"/><rect x="338" y="52" width="12" height="16" rx="6"/>
  </g>
</svg>

<div id="safe">
  <div class="wm"><span class="wm-box">Product</span><span>&Lambda;dvisory</span><span class="wm-ins">Insights</span></div>
  <div class="tag">Product strategy, pricing and AI, explained with the numbers</div>
  <div class="sub">Animated explainers &middot; Read aloud &middot; Product+</div>
</div>
<div id="guide"></div>
</body></html>
